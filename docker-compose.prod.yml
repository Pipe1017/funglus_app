version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: funglusapp_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - funglusapp_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funglusapp_backend_prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - funglusapp_network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: funglusapp_frontend_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # Para certificados SSL
    networks:
      - funglusapp_network
    depends_on:
      - backend
    restart: always

  # Opcional: Nginx como reverse proxy
  nginx:
    image: nginx:alpine
    container_name: funglusapp_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - funglusapp_network
    depends_on:
      - frontend
      - backend
    restart: always

networks:
  funglusapp_network:
    driver: bridge

volumes:
  postgres_data_prod:
