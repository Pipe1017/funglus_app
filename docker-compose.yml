services:
  # ═══════════════════════════════════════════════════════════
  # 🗄️ BASE DE DATOS - PostgreSQL
  # ═══════════════════════════════════════════════════════════
  db:
    image: postgres:15-alpine
    container_name: funglusapp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funglusapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funglusapp123}
      POSTGRES_DB: ${POSTGRES_DB:-funglusapp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_data.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - funglusapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funglusapp -d funglusapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # 🐍 BACKEND - FastAPI
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funglusapp_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://funglusapp:funglusapp123@db:5432/funglusapp_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-CHANGE-IN-PRODUCTION}
      
      # ┌──────────────────────────────────────────────────┐
      # │ 🔧 CONFIGURACIÓN POR ENTORNO                     │
      # └──────────────────────────────────────────────────┘
      # 🏠 DESARROLLO LOCAL (Mac M4 Pro)
      # ENVIRONMENT: development
      # DEBUG: "true"
      
      # ☁️ PRODUCCIÓN (Linux + Cloudflare)
      ENVIRONMENT: production
      DEBUG: "false"  # Cambiado a false para producción
      
      # 🌐 CONFIGURACIÓN CORS
      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://192.168.1.4,http://192.168.1.4:80,http://192.168.1.4:5173,https://funglus.bunnatek.com,https://funglus-api.bunnatek.com"
    
    #ports:
    #  - "8000:8000"
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    healthcheck:
      # Usamos python nativo para no depender de que curl esté instalado
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - funglusapp_network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ⚛️ FRONTEND - React/Vite
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ┌──────────────────────────────────────────────────┐
        # │ 🔧 URL DE LA API - SELECCIONAR UNA OPCIÓN        │
        # └──────────────────────────────────────────────────┘
        # 🏠 DESARROLLO LOCAL
        # VITE_API_URL: http://localhost:8000/api/v1
        
        # 🌐 RED LOCAL
        # VITE_API_URL: http://192.168.1.4:8000/api/v1
        
        # ☁️ PRODUCCIÓN
        VITE_API_URL: https://funglus-api.bunnatek.com/api/v1
    
    container_name: funglusapp_frontend
    #ports:
    #  - "80:80"
    #  - "443:443"  # Añadido para HTTPS si es necesario
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - funglusapp_network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ☁️ TÚNEL CLOUDFLARE (solo producción)
  # ═══════════════════════════════════════════════════════════
  # NOTA: Configuración gestionada remotamente vía Dashboard
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: funglusapp_cloudflared
    command: tunnel --protocol quic run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - funglusapp_network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x cloudflared > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════
# REDES
# ═══════════════════════════════════════════════════════════
networks:
  funglusapp_network:
    driver: bridge

# ═══════════════════════════════════════════════════════════
# VOLÚMENES
# ═══════════════════════════════════════════════════════════
volumes:
  postgres_data: